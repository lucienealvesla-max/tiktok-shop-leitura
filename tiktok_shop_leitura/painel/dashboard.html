<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desempenho · TikTok Shop</title>
<style>
:root{
  --breu:#140E19;
  --painel:#1D1422;
  --painel2:#251A2C;
  --sulco:#2C1F34;
  --lampada:#F2B25C;
  --rosa:#F2A2B0;
  --texto:#F7F0F4;
  --fraco:#A492AE;
  --alerta:#F09A8C;
  --bom:#8FD3A8;

  --tecnica:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --corpo:"Corbel","Candara","Optima","Segoe UI",system-ui,sans-serif;
  --dado:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--breu)}
body{
  min-height:100vh;
  background:radial-gradient(120% 80% at 50% -10%, #24182B 0%, transparent 60%), var(--breu);
  color:var(--texto);font-family:var(--corpo);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:26px 18px 70px;
}
.folha{max-width:980px;margin:0 auto}
.topo{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--sulco);margin-bottom:22px;flex-wrap:wrap}
.topo h1{font-family:var(--tecnica);font-size:26px;margin:0}
.topo a{color:var(--fraco);text-decoration:none;font-family:var(--tecnica);
  font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.topo a:hover{color:var(--rosa)}

h2{font-family:var(--tecnica);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--fraco);margin:30px 0 10px;font-weight:600}
.cartao{background:var(--painel);border:1px solid var(--sulco);border-radius:12px;
  padding:16px 18px;margin-bottom:12px}
.numerao{font-family:var(--tecnica);font-size:32px;line-height:1.1}
.rotulo{font-family:var(--tecnica);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fraco);margin-top:4px}
.sub{font-size:13px;color:var(--fraco);margin-top:8px;line-height:1.45}

/* OS QUATRO NUMEROS DA MONETIZACAO. E a unica parte da tela em que o numero
   grande e o ponto: cada um e uma regra do programa, e a cor diz se ela esta
   dentro. Cinza e "nao lido", que e diferente de "fora". */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0 4px}
.kpi{background:var(--painel2);border:1px solid var(--sulco);border-radius:10px;padding:12px 14px}
.kpi .numerao{font-size:26px}
.kpi.ok .numerao{color:var(--bom)}
.kpi.ruim .numerao{color:var(--alerta)}
.kpi.vazio .numerao{color:var(--fraco)}
.kpi .sub{margin-top:4px}

.linha{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}
.linha .nome{font-family:var(--dado);font-size:13px;width:104px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra{flex:1;height:14px;background:var(--sulco);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--rosa);border-radius:4px}
.barra i.quente{background:var(--lampada)}
.linha .qtd{font-family:var(--dado);font-size:13px;color:var(--fraco);width:126px;
  flex:none;text-align:right}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--tecnica);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fraco);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--sulco)}
td{padding:7px 8px;border-bottom:1px solid rgba(44,31,52,.6)}
td.n{font-family:var(--dado);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}

.aviso{border-left:3px solid var(--lampada);background:var(--painel2);padding:12px 14px;
  border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.aviso.ruim{border-left-color:var(--alerta)}
.aviso b{color:var(--lampada)}
.aviso.ruim b{color:var(--alerta)}
.aviso.esperando{border-left-color:var(--fraco);color:var(--fraco)}
.aviso.esperando b{color:var(--texto)}

code{font-family:var(--dado);font-size:13px;background:var(--painel2);padding:3px 7px;
  border-radius:4px;color:var(--lampada);word-break:break-all;display:inline-block;margin-top:3px}
ol{padding-left:20px;margin:10px 0}
ol li{margin:9px 0}
.botao{display:inline-block;background:var(--rosa);color:#2A1020;border:none;border-radius:8px;
  padding:10px 18px;font-family:var(--tecnica);font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;text-decoration:none}
.botao:hover{background:var(--lampada)}
.botao:disabled{opacity:.5;cursor:default}
.bom{color:var(--bom)}
#carregando{color:var(--fraco);font-size:15px}
/* QUAL VIDEO E ESTE. 92 videos dela comecam com os mesmos 40 caracteres de
   titulo, entao o titulo sozinho nunca respondeu: a capa responde de relance,
   a hora separa duas publicacoes do mesmo produto no mesmo dia, e o link
   resolve o resto num clique. */
.video{display:flex;gap:10px;align-items:flex-start}
.video img.capa{width:44px;height:58px;object-fit:cover;border-radius:5px;
  background:var(--sulco);flex:none}
.video a{color:var(--texto);text-decoration:none;border-bottom:1px solid var(--sulco)}
.video a:hover{color:var(--rosa);border-bottom-color:var(--rosa)}
.video .quando{display:block;font-family:var(--dado);font-size:12px;color:var(--fraco);
  margin-top:2px}

/* A PAUTA. Unica parte da tela escrita em frase e nao em numero: e o que ela
   le de manha antes de gravar, e por isso e a primeira coisa da pagina. */
.pauta{border-left:3px solid var(--rosa);padding:9px 0 9px 14px;margin:14px 0}
.pauta .acao{font-family:var(--tecnica);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--lampada)}
.pauta .texto{margin-top:3px}
/* DE ONDE SAIU, sempre junto: conselho que ela nao consegue conferir, com o
   tempo, ela para de seguir. */
.pauta .fonte{font-size:12px;color:var(--fraco);margin-top:3px;font-family:var(--dado)}
/* A menção de marca é mais comprida que "22h", que foi para o que a coluna
   original de 104px foi medida. */
.largo .linha .nome{width:170px}
/* A LINHA DE ESTADO. Era um cartao "Resumo" com um paragrafo que repetia os
   outros paineis; agora e uma linha: quantos videos, quantos dias, quando le,
   que versao, e o botao. */
.estado{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--fraco)}
.estado b{color:var(--texto);font-weight:600}
</style>
</head>
<body>
<div class="folha">
  <div class="topo">
    <h1>Desempenho</h1>
    <!-- Relativo de proposito: sob o Ingress do HA um "/" sai do add-on e cai
         na raiz do proprio Home Assistant, e "./" fica dentro do mesmo lugar
         nos dois servidores (painel.py e o do Pi). -->
    <a href="./">&larr; painel</a>
  </div>
  <p id="carregando">Lendo…</p>
  <div id="tudo" style="display:none"></div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function n(x, casas){
  if(x === null || x === undefined) return "—";
  return Number(x).toLocaleString("pt-BR", {minimumFractionDigits: casas || 0,
                                            maximumFractionDigits: casas || 0});
}
/* O NOME DE UM VIDEO, em qualquer lugar da tela. `capa` de fora porque nem
   todo painel tem espaco para imagem, e porque a capa e o unico pedaco daqui
   que faz o navegador falar com a internet. */
function videoNome(x, comCapa){
  var t = esc(x.titulo || "(sem título)");
  var nome = x.link
    ? '<a href="' + esc(x.link) + '" target="_blank" rel="noopener">' + t + '</a>'
    : t;
  var quando = x.publicado ? '<span class="quando">' + esc(x.publicado) + '</span>' : '';
  /* O ENDERECO DA CAPA E ASSINADO E EXPIRA. Video que nao vem numa leitura ha
     dias fica com um endereco vencido, e sem o `onerror` a tela encheria de
     icone de imagem quebrada - que parece defeito do painel, e nao e. */
  var capa = (comCapa && x.capa)
    ? '<img class="capa" src="' + esc(x.capa) + '" alt="" loading="lazy" ' +
      'onerror="this.remove()">'
    : "";
  return '<div class="video">' + capa + '<div>' + nome + quando + '</div></div>';
}

function barras(itens, quente){
  var maior = 0;
  itens.forEach(function(i){ if(i.valor > maior) maior = i.valor; });
  return itens.map(function(i, k){
    var pct = maior ? (i.valor / maior) * 100 : 0;
    /* O rotulo vira link quando ha video por tras dele. A dica traz a data,
       que e o que separa dois videos de titulo igual sem gastar largura. */
    var nome = i.link
      ? '<a href="' + esc(i.link) + '" target="_blank" rel="noopener">' +
        esc(i.rotulo) + '</a>'
      : esc(i.rotulo);
    return '<div class="linha"><span class="nome" title="' + esc(i.rotulo) +
      (i.dica ? " · " + esc(i.dica) : "") + '">' + nome + '</span>' +
      '<span class="barra"><i class="' + (quente && quente(i, k) ? "quente" : "") +
      '" style="width:' + pct.toFixed(1) + '%"></i></span>' +
      '<span class="qtd">' + esc(i.texto) + '</span></div>';
  }).join("");
}

/* Bloco que depende de histórico e ainda não tem: diz quantas leituras faltam,
   em vez de aparecer vazio. Tela vazia sem explicação parece defeito. */
function esperando(faltam, oque){
  return '<div class="cartao"><div class="aviso esperando"><b>Faltam ' + faltam +
    ' leitura(s).</b> ' + oque + ' só existe comparando leituras de dias diferentes — ' +
    'o TikTok não guarda isso em lugar nenhum, então o painel constrói a série a partir ' +
    'de agora.</div></div>';
}

/* A LEITURA DE HOJE COBRIU QUANTO DA CONTA. Em 06/09/2026 a leitura encolheu
   de 2.328 para 958 videos e a tela nao mudou de cara: o video de 2,1 milhao
   sumiu sem uma linha de aviso. O painel agora guarda tudo que ja viu (o
   catalogo), entao nada some - mas o numero tem que aparecer, ou a proxima
   vez volta a levar tres meses para ser notada. */
/* A hora da leitura vem do servidor. Numero escrito na pagina mentiria assim
   que ela mudasse a opcao na tela do add-on. */
function horaDaLeitura(tk){
  var h = (tk || {}).hora_da_leitura;
  return (h === null || h === undefined) ? "uma vez por dia" : h + "h";
}

function blocoCobertura(c){
  if(!c || c.completa) return "";
  return '<div class="cartao"><div class="aviso ruim">' +
    '<b>A última leitura trouxe ' + n(c.na_ultima_leitura) + ' dos ' +
    n(c.conhecidos) + ' vídeos que este painel já viu.</b> Os outros ' +
    n(c.nao_vieram) + ' continuam nas contas, com o último número conhecido de ' +
    'cada um — nada foi perdido. O que muda é a atualidade: vídeo que não veio ' +
    'hoje está com o número do dia em que veio pela última vez. ' +
    '"Acelerando", "Ressuscitou", "Largada" e o ganho da monetização só usam ' +
    'leitura de verdade, então esses não misturam.</div></div>';
}

function painelPauta(p){
  if(!p || !(p.itens || []).length) return "";
  return '<h2>O que fazer amanhã</h2><div class="cartao">' +
    '<div class="sub">O resto da tela mostra <b>o que aconteceu</b>. Isto aqui é ' +
    'a tradução: o que dá para fazer com isso amanhã de manhã. Cada linha diz de ' +
    'onde saiu — conselho sem origem não se confere, e o que não se confere não ' +
    'se segue.</div>' +
    p.itens.map(function(i){
      /* A linha que fala de um video especifico leva a capa e o link: sem
         isso, "refaca este video" mandava ela procurar entre 92 titulos
         iguais qual era o certo. */
      var alvo = (i.link || i.capa)
        ? videoNome({titulo: i.texto, link: i.link, capa: i.capa}, true)
        : '<div class="texto">' + esc(i.texto) + '</div>';
      return '<div class="pauta"><div class="acao">' + esc(i.acao) + '</div>' +
        alvo + '<div class="fonte">' + esc(i.de_onde) + '</div></div>';
    }).join("") + '</div>';
}

/* MONETIZACAO. As regras do Programa de Recompensas vem do servidor
   (`regras`), nunca escritas aqui: o TikTok muda os numeros sem avisar, e a
   tela tem que mostrar a regra que o calculo usou. */
function painelMonetizacao(m){
  var h = '<h2>Monetização</h2>';
  if(!m) return "";
  if(!m.pronto) return h + esperando(m.faltam || 1, "Medir as views ganhas em 30 dias");
  var r = m.regras || {};
  var kpis =
    '<div class="kpi ' + (m.views_ok ? "ok" : "ruim") + '">' +
      '<div class="numerao">' + n(m.views_30d) + '</div>' +
      '<div class="rotulo">views em 30 dias' +
        (m.projetado ? ' · projetado' : '') + '</div>' +
      '<div class="sub">regra: ' + n(r.views_30d) + ' · <b>' + n(m.views_vezes, 1) + 'x</b>' +
        (m.projetado ? ' · medido em ' + m.dias_medidos + ' dia(s)' : '') + '</div>' +
    '</div>' +
    '<div class="kpi vazio">' +
      '<div class="numerao">' + (m.seguidores == null ? "—" : n(m.seguidores)) + '</div>' +
      '<div class="rotulo">seguidores</div>' +
      '<div class="sub">' + (m.seguidores == null
        ? 'ainda não lido — falta o escopo <code>user.info.stats</code>'
        : 'regra: ' + n(r.seguidores)) + '</div>' +
    '</div>' +
    '<div class="kpi ' + (m.pct_longos == null ? "vazio" : (m.pct_longos >= 50 ? "ok" : "ruim")) + '">' +
      '<div class="numerao">' + (m.pct_longos == null ? "—" : n(m.pct_longos, 0) + '%') + '</div>' +
      '<div class="rotulo">passam de 1 min</div>' +
      '<div class="sub">' + n(m.longos) + ' de ' + n(m.publicados) + ' publicados nos últimos ' +
        (m.janela_dias || 30) + ' dias — só esses contam</div>' +
    '</div>' +
    '<div class="kpi ' + (m.longo_vs_curto == null ? "vazio" : (m.longo_vs_curto >= 1.5 ? "ok" : "")) + '">' +
      '<div class="numerao">' + (m.longo_vs_curto == null ? "—" : n(m.longo_vs_curto, 1) + 'x') + '</div>' +
      '<div class="rotulo">longo × curto</div>' +
      '<div class="sub">views novas por vídeo no período</div>' +
    '</div>';
  h += '<div class="cartao">' +
    '<div class="sub">Programa de Recompensas do Criador: <b>' + n(r.seguidores) +
    ' seguidores</b>, <b>' + n(r.views_30d) + ' views nos últimos 30 dias</b> e vídeo ' +
    'de <b>mais de 1 minuto</b>. O app mostra o acumulado de cada vídeo; a regra mede o ' +
    'que a conta <b>ganhou no período</b> — e isso só sai da série de leituras.</div>' +
    '<div class="kpis">' + kpis + '</div>';
  if((m.faixas || []).length){
    h += '<div class="rotulo" style="margin-top:14px">Views novas por vídeo, por duração</div>' +
      barras(m.faixas.map(function(f){
        return {rotulo: f.rotulo, valor: f.ganho_por_video,
                texto: n(f.ganho_por_video) + "  (" + f.videos + " víd.)"};
      }), function(i){ return i.rotulo === "mais de 1 min"; }) +
      '<div class="sub">Ganho de views entre ' + esc(m.desde) + ' e ' + esc(m.ate) +
      ', dividido pelo número de vídeos da faixa. Vídeo longo é o que conta para a ' +
      'regra — e é o que mais cresce.</div>';
  }
  return h + '</div>';
}

/* QUAL PERFIL ESTA NA TELA. Ela tem mais de um, e o que funciona num publico
   nao funciona no outro - somar esconderia justamente o que ela precisa ver.
   A escolha fica no navegador, entao recarregar nao volta pro primeiro. */
var contaEscolhida = "";
try { contaEscolhida = localStorage.getItem("tiktok_conta") || ""; } catch(e){}

function blocoPerfis(tk){
  var cs = tk.contas || [];
  if(!cs.length) return "";
  var noPC = (location.hostname === "localhost" || location.hostname === "127.0.0.1");
  var h = '<div class="cartao"><div class="rotulo">Perfil</div>';
  if(cs.length > 1){
    h += '<p><select id="perfil">' + cs.map(function(c){
      return '<option value="' + esc(c.open_id) + '"' +
        (c.open_id === contaEscolhida ? ' selected' : '') + '>' +
        esc(c.nome) + ' — ' + c.dias + ' dia(s) de histórico</option>';
    }).join("") + '</select></p>';
  } else {
    h += '<div class="sub"><b>' + esc(cs[0].nome) + '</b> — ' + cs[0].dias +
         ' dia(s) de histórico</div>';
  }
  /* Adicionar perfil e o mesmo "entrar" de sempre: como a conta se identifica
     sozinha pelo open_id, entrar de novo SOMA em vez de substituir. */
  /* href absoluto aqui, sem problema: so aparece quando noPC e verdadeiro
     (hostname e localhost/127.0.0.1), e isso nunca acontece atras do
     Ingress do Pi - o ramo "abra no computador" e' o unico que roda la. */
  h += '<div class="sub">' + (noPC
    ? '<a class="botao" style="padding:4px 10px;font-size:11px" ' +
      'href="/tiktok/entrar">Adicionar outro perfil</a> ' +
      'Saia da outra conta no navegador antes, senão o TikTok repete esta.'
    : 'Para adicionar outro perfil, abra esta página no computador.') +
    '</div></div>';
  return h;
}

function ligarSeletorDePerfil(){
  var s = $("perfil");
  if(!s) return;
  s.onchange = function(){
    contaEscolhida = s.value;
    try { localStorage.setItem("tiktok_conta", contaEscolhida); } catch(e){}
    carregar();
  };
}

function blocoConexao(tk){
  if(!tk.configurado){
    return '<div class="cartao"><div class="rotulo">Falta ligar a API</div>' +
      '<div class="sub">Tudo nesta tela sai da API do TikTok. Configurada uma vez, o painel ' +
      'guarda uma leitura por dia e passa a mostrar o que o app não mostra.</div><ol>' +
      '<li>Em <b>developers.tiktok.com</b>, crie um app do tipo <b>Desktop</b>.</li>' +
      '<li>Adicione <b>Login Kit</b> e <b>Display API</b> (escopos <code>user.info.basic</code> ' +
      'e <code>video.list</code>). O <code>video.list</code> só aparece depois do ' +
      'Display API entrar.</li>' +
      '<li>Endereço de retorno, em <b>Products → Login Kit → Desktop</b> (não é a caixa ' +
      'de verificação de URL, que pede https e nunca aceita localhost):<br><code>' +
      esc(tk.retorno || "") + '</code></li>' +
      '<li>Deixe o app em <b>Sandbox</b> e adicione cada perfil em <b>Target users</b> — ' +
      'perfil que não estiver ali recusa o login com <code>non_sandbox_target</code>.</li>' +
      '<li>Grave a chave em <code>painel/tiktok.json</code>, reinicie o painel e recarregue ' +
      'esta página <b>no computador</b>.</li></ol></div>';
  }
  if(!tk.conectado){
    var noPC = (location.hostname === "localhost" || location.hostname === "127.0.0.1");
    // Mesmo caso do href absoluto em blocoPerfis(): so roda com noPC
    // verdadeiro, e no Pi (atras do Ingress) isso nunca acontece.
    return '<div class="cartao"><div class="rotulo">Falta autorizar</div>' +
      (noPC ? '<p><a class="botao" href="/tiktok/entrar">Entrar no TikTok</a></p>'
            : '<div class="aviso"><b>Isto precisa ser feito no computador.</b> O TikTok ' +
              'devolve a autorização para <code>localhost</code>, que no celular é o ' +
              'próprio celular.</div>') + '</div>';
  }
  return '<div class="cartao"><div class="rotulo">Conectado, sem leitura ainda</div>' +
    '<div class="sub">A primeira leitura já mostra metade dos painéis. Os outros precisam ' +
    'de dias seguidos para comparar.</div>' +
    /* MESMA GUARDA do bloco de estado (ver desenhar()): este perfil pode
       nao ter foto nenhuma ainda e cair aqui mesmo depois da migracao para
       o Pi - achado numa revisao, com o perfil dela sem leitura nenhuma. */
    (tk.dono_da_leitura === false
      ? '<p class="sub">A leitura mora ' + (tk.leitura_em
          ? 'em <a href="' + esc(tk.leitura_em) + '">' + esc(tk.leitura_em) + '</a>'
          : 'noutra máquina') + ', que fica ligada o dia inteiro.</p>'
      : '<p><button class="botao" id="puxar">Ler agora</button>' +
        '<span id="puxar-recado" class="sub"></span></p>') +
    '<div class="sub">A leitura traz a conta inteira, do primeiro vídeo até hoje — ' +
    'leva uns minutos. Com a leitura automática ligada, isso acontece sozinho às ' +
    horaDaLeitura(tk) + '.' +
    '</div></div>';
}

/* A LINHA DE ESTADO: o que era o cartao "Resumo". O paragrafo de texto saiu
   (repetia os outros paineis); ficaram os controles, que precisam estar aqui
   em cima e nao escondidos numa tela de configuracao - a leitura diaria e o
   que faz a serie existir. */
function blocoEstado(d, tk){
  var h = '<div class="cartao"><div class="estado">' +
    '<span><b>' + n(d.videos) + '</b> vídeos</span>' +
    '<span><b>' + d.dias_de_historico + '</b> dia(s) de histórico</span>';
  /* QUEM LÊ. O token do TikTok é rotativo: duas máquinas renovando derrubam
     uma a outra. Quando esta não é a dona, o botão não some — sumir pareceria
     defeito — ele vira o recado de onde a leitura mora agora. */
  if(tk.dono_da_leitura === false){
    h += '<span>A leitura mora ' + (tk.leitura_em
      ? 'em <a href="' + esc(tk.leitura_em) + '">' + esc(tk.leitura_em) + '</a>'
      : 'noutra máquina') + ', que fica ligada o dia inteiro.</span>';
  } else {
    /* SEM AGENDADOR NESTA MAQUINA (Raspberry): nao existe Agendador de
       Tarefas do Windows aqui pra ligar/desligar, entao o botao que chama
       api/tiktok/diario/ligar - rota que so existe no painel.py - daria
       404 calado. O painel dela nunca manda esta chave, entao este ramo
       nunca roda la e as duas linhas de baixo continuam intocadas. */
    h += '<span>' + (tk.agendador === false
      ? '<b class="bom">Lendo sozinho todo dia às ' + horaDaLeitura(tk) + '.</b>'
      : (tk.leitura_diaria
      ? '<b class="bom">Lendo sozinho todo dia às ' + horaDaLeitura(tk) + '.</b> ' +
        '<button class="botao" id="diario-parar" style="padding:4px 10px;font-size:11px">' +
        'desligar</button>'
      : 'Leitura automática <b>desligada</b> — cada dia sem leitura é um buraco na série ' +
        'que não se recupera depois. ' +
        '<button class="botao" id="diario-ligar" style="padding:4px 10px;font-size:11px">' +
        'ligar</button>')) +
      ' <span id="diario-recado"></span></span>' +
      '<span><button class="botao" id="puxar" style="padding:6px 12px;font-size:12px">' +
      'Ler agora</button><span id="puxar-recado"></span></span>';
  }
  /* DE QUE VERSAO ISTO FOI CONSTRUIDO, e quando o painel foi calculado. A tela
     le um arquivo pronto (pronto.py); saber de quando ele e' evita "por que
     nao mudou?" depois de uma leitura. */
  if(tk.versao) h += '<span>versão ' + esc(tk.versao) + '</span>';
  if(d.calculado_em){
    var q = new Date(d.calculado_em * 1000);
    h += '<span>calculado ' + esc(q.toLocaleString("pt-BR", {day: "2-digit", month: "2-digit",
      hour: "2-digit", minute: "2-digit"})) + (d.levou_s ? ' em ' + n(d.levou_s, 1) + 's' : '') + '</span>';
  }
  return h + '</div></div>';
}

function desenhar(d){
  var tk = d.tiktok || {};
  if(!d.tem_dados){
    $("tudo").innerHTML = '<h2>Conexão com o TikTok</h2>' +
      blocoPerfis(tk) + blocoConexao(tk);
    ligarSeletorDePerfil();
    ligarPuxar();
    ligarDiario();
    $("carregando").style.display = "none";
    $("tudo").style.display = "";
    return;
  }

  var h = blocoPerfis(tk);
  h += blocoCobertura(d.cobertura);
  h += blocoEstado(d, tk);
  h += painelPauta(d.pauta);
  h += painelMonetizacao(d.monetizacao);

  /* ---------- largada: as primeiras horas ---------- */
  var lg = d.largada || {};
  h += '<h2>Largada — as primeiras horas</h2>';
  if(!lg.pronto){
    h += esperando(lg.faltam, "Saber se um vídeo novo largou bem");
  } else if(!(lg.itens || []).length){
    h += '<div class="cartao"><div class="sub">Nenhum vídeo publicado nas últimas ' +
      (lg.janela_horas || 48) + ' horas foi lido ainda. Assim que houver, aparece aqui.' +
      '</div></div>';
  } else {
    h += '<div class="cartao"><div class="sub">Reagir a um vídeo que está subindo só ' +
      'vale <b>enquanto ele sobe</b>: responder comentário, fixar comentário, gravar a ' +
      'parte 2, empurrar o link. Cada vídeo é comparado com os outros da mesma <b>idade</b> ' +
      '— 14 horas contra 28 horas não compara nada, porque o mais velho sempre teria mais. ' +
      'A janela em que vale insistir é de uns 2 dias: é o que o vídeo dela leva para juntar ' +
      '80% das views que vai ter.' +
      '</div><table><tr><th>Vídeo</th><th class="n">Idade</th>' +
      '<th class="n">Views</th><th class="n">Contra a faixa</th></tr>' +
      lg.itens.map(function(x){
        var comp = (x.vezes_a_largada === null || x.vezes_a_largada === undefined)
          ? '<span class="sub">só ' + x.comparaveis + ' na faixa</span>'
          : (x.vezes_a_largada >= 1.5 ? '<b class="bom">' + x.vezes_a_largada + 'x</b>'
                                      : x.vezes_a_largada + 'x');
        return '<tr><td>' + videoNome(x, true) + '</td>' +
          '<td class="n">' + x.horas + 'h</td>' +
          '<td class="n">' + n(x.views) + '</td>' +
          '<td class="n">' + comp + '</td></tr>';
      }).join("") + '</table></div>';
  }

  /* ---------- acelerando ---------- */
  h += '<h2>Acelerando agora</h2>';
  if(!d.acelerando.pronto){
    h += esperando(d.acelerando.faltam, "Saber o que está crescendo");
  } else {
    var a = d.acelerando.itens.filter(function(x){ return x.ganho_ultimo > 0; });
    h += '<div class="cartao"><div class="sub">O app só mostra o total acumulado. Um vídeo ' +
      'de 50 mil pode estar parado há duas semanas, e um de 3 mil pode ter ganhado 2 mil ' +
      'ontem — lá os dois parecem o que não são.</div>' +
      (a.length
        ? '<table><tr><th>Vídeo</th><th class="n">Ganhou na última</th><th class="n">7 dias</th>' +
          '<th class="n">Total</th></tr>' +
          a.map(function(x){
            return '<tr><td>' + videoNome(x, true) + '</td>' +
              '<td class="n bom">+' + n(x.ganho_ultimo) + '</td>' +
              '<td class="n">+' + n(x.ganho_7d) + '</td>' +
              '<td class="n">' + n(x.views) + '</td></tr>';
          }).join("") + '</table>'
        : '<div class="sub">Nenhum vídeo ganhou views desde a última leitura.</div>') +
      '</div>';
  }

  /* ---------- ressurreições ---------- */
  h += '<h2>Ressuscitou</h2>';
  if(!d.ressurreicoes.pronto){
    h += esperando(d.ressurreicoes.faltam, "Detectar vídeo antigo voltando a crescer");
  } else if(!d.ressurreicoes.itens.length){
    h += '<div class="cartao"><div class="sub">Nenhum vídeo antigo voltou a crescer. Quando ' +
      'acontecer, aparece aqui no mesmo dia — o TikTok não avisa.</div></div>';
  } else {
    h += '<div class="cartao"><div class="aviso"><b>O TikTok revive vídeo antigo o tempo ' +
      'todo e não avisa.</b> Sabendo hoje, dá para reagir enquanto ainda está subindo: ' +
      'continuação, responder comentário, empurrar o link.</div>' +
      '<table><tr><th>Vídeo</th><th class="n">Idade</th><th class="n">Ganhou agora</th>' +
      '<th class="n">Ritmo anterior</th></tr>' +
      d.ressurreicoes.itens.map(function(x){
        return '<tr><td>' + videoNome(x, true) + '</td><td class="n">' + x.idade_dias + 'd</td>' +
          '<td class="n bom">+' + n(x.ganho_ultimo) + '</td>' +
          '<td class="n">' + n(x.ritmo_anterior) + '/dia</td></tr>';
      }).join("") + '</table></div>';
  }

  /* ---------- refazer: o video bom que nao foi entregue ---------- */
  var rf = d.refazer || {};
  if((rf.itens || []).length){
    h += '<h2>Vale refazer</h2><div class="cartao">' +
      '<div class="aviso"><b>View é o que o TikTok deu; compartilhar e comentar é o que a ' +
      'pessoa fez.</b> Estes vídeos ficaram abaixo da sua mediana de views, mas quem viu ' +
      'reagiu muito acima do normal — não são vídeos ruins, são vídeos bons que não foram ' +
      'entregues. Refazer um destes é a aposta mais segura da semana: o assunto já passou ' +
      'no teste que importa, e só a capa, o gancho ou o horário mudam.</div>' +
      '<table><tr><th>Vídeo</th><th class="n">Views</th><th>Por quê</th>' +
      '<th class="n">Contra a mediana</th><th class="n">Idade</th></tr>' +
      rf.itens.map(function(x){
        return '<tr><td>' + videoNome(x, true) + '</td>' +
          '<td class="n">' + n(x.views) + '</td>' +
          '<td>' + esc(x.motivo) + '</td>' +
          '<td class="n bom">' + x.forca + 'x</td>' +
          '<td class="n">' + x.idade_dias + 'd</td></tr>';
      }).join("") + '</table>' +
      '<div class="sub">Mediana da conta: <b>' + n(rf.mediana_views) + ' views</b>, ' +
      n(rf.mediana_compartilhamento, 2) + '% de compartilhamento e ' +
      n(rf.mediana_comentario, 2) + '% de comentário por view.</div></div>';
  }

  /* ---------- parcerias e marcas ---------- */
  var pc = d.parcerias || {};
  if((pc.itens || []).length){
    h += '<h2>Parcerias e marcas</h2><div class="cartao largo">' +
      '<div class="sub">Você é afiliada: saber qual parceria rende é decisão de negócio, não ' +
      'curiosidade. Isto mede <b>views</b>, que é o que a API dá hoje; comissão por marca ' +
      'entra quando a Central de Afiliados for ligada. Quando você cola o nome de exibição ' +
      'da marca ("@Grupo On Line Editora"), só a primeira palavra vira menção — o TikTok ' +
      'separaria igual. A régua é a sua mediana (' + n(pc.geral) + ' views).</div>' +
      barras(pc.itens.map(function(x){
        return {rotulo: x.termo, valor: x.vezes_a_geral,
                texto: x.vezes_a_geral + "x  (" + x.videos + " víd.)"};
      }), function(i){ return i.valor >= 1.5; }) + '</div>';
  }

  $("tudo").innerHTML = h;
  ligarSeletorDePerfil();
  ligarPuxar();
  ligarDiario();
  $("carregando").style.display = "none";
  $("tudo").style.display = "";
}

function ligarDiario(){
  [["diario-ligar", "api/tiktok/diario/ligar"],
   ["diario-parar", "api/tiktok/diario/parar"]].forEach(function(par){
    var b = $(par[0]);
    if(!b) return;
    b.onclick = function(){
      b.disabled = true;
      $("diario-recado").textContent = " ajustando…";
      fetch(par[1], {method: "POST"}).then(function(r){ return r.json(); })
        .then(function(res){
          $("diario-recado").textContent = " " + (res.mensagem || "");
          if(res.ok) setTimeout(function(){ location.reload(); }, 1200);
          else b.disabled = false;
        })
        .catch(function(e){
          $("diario-recado").textContent = " não deu: " + (e.message || e);
          b.disabled = false;
        });
    };
  });
}

function ligarPuxar(){
  var bt = $("puxar");
  if(!bt) return;
  bt.onclick = function(){
    bt.disabled = true;
    /* Le a conta INTEIRA (2.327 videos dela levaram ~3 min). Sem este aviso a
       tela parece travada e ela recarrega a pagina no meio - perdendo a leitura
       e, com ela, o dia na serie. O contador existe pra dar sinal de vida. */
    var t0 = Date.now();
    var relogio = setInterval(function(){
      var s = Math.round((Date.now() - t0) / 1000);
      $("puxar-recado").textContent = " lendo a conta inteira… " +
        (s < 60 ? s + "s" : Math.floor(s / 60) + "min" + (s % 60) + "s") +
        " (costuma levar uns 3 minutos — não feche a página)";
    }, 1000);
    fetch("api/tiktok/puxar", {method: "POST"})
      .then(function(r){ return r.json(); })
      .then(function(res){
        /* Um perfil pode falhar e os outros darem certo. Mostrar o recado de
           cada um evita ela achar que leu tudo quando leu metade. */
        clearInterval(relogio);
        $("puxar-recado").textContent = (res.ok ? " pronto" : " não deu") +
          (res.recado ? " — " + res.recado : (res.ok ? ", recarregando…" : ": " +
           (res.erro || "erro")));
        if(res.ok) setTimeout(function(){ location.reload(); }, 1000);
        else bt.disabled = false;
      })
      .catch(function(e){
        clearInterval(relogio);
        $("puxar-recado").textContent = " não deu: " + (e.message || e);
        bt.disabled = false;
      });
  };
}

/* Uma funcao, e nao a chamada solta, porque o seletor de perfil recarrega os
   dados sem recarregar a pagina - recarregar perderia a posicao da rolagem e
   piscaria a tela inteira a cada troca. */
function carregar(){
  $("carregando").style.display = "";
  $("tudo").style.display = "none";
  fetch("api/desempenho?conta=" + encodeURIComponent(contaEscolhida),
        {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.erro || "resposta sem dados");
      /* O painel decide qual perfil respondeu (a primeira visita nao pediu
         nenhum). Guardar aqui deixa o seletor marcando o certo. */
      if(d.conta){
        contaEscolhida = d.conta;
        try { localStorage.setItem("tiktok_conta", contaEscolhida); } catch(e){}
      }
      desenhar(d);
    })
    .catch(function(e){
      $("carregando").style.display = "";
      $("carregando").innerHTML = '<div class="aviso ruim"><b>Não consegui abrir:</b> ' +
        esc(e.message || e) + '</div>';
    });
}

carregar();
</script>
